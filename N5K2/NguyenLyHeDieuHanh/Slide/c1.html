﻿<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Trắc nghiệm Chương 1: Giới thiệu về Hệ điều hành</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #f0f4f8;
            margin: 0;
            padding: 20px;
            color: #1a2c3a;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 28px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
            overflow: hidden;
            padding: 20px 24px 32px;
        }
        h1 {
            font-size: 1.9rem;
            margin-top: 0;
            margin-bottom: 0.25rem;
            color: #0a4b6e;
            border-left: 6px solid #0a4b6e;
            padding-left: 20px;
        }
        .sub {
            color: #4b6f86;
            margin-bottom: 28px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 12px;
            padding-left: 26px;
        }
        .controls {
            text-align: right;
            margin-bottom: 20px;
        }
        .action-btn {
            padding: 8px 16px;
            background-color: #2c7da0;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            transition: 0.2s;
        }
        .action-btn:hover {
            background-color: #1f5e7a;
        }
        .question-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 18px 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid #e4edf2;
            transition: all 0.1s ease;
        }
        .question-text {
            font-weight: 600;
            font-size: 1.05rem;
            margin-bottom: 14px;
            color: #0b2b3b;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-left: 8px;
        }
        .option {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 40px;
            background: #f9fafc;
            transition: background 0.2s;
            border: 1px solid #e2edf2;
        }
        .option:hover {
            background: #eef3fa;
        }
        input[type="radio"] {
            width: 18px;
            height: 18px;
            accent-color: #2c7da0;
            margin: 0;
            cursor: pointer;
        }
        .option label {
            flex: 1;
            cursor: pointer;
            font-weight: normal;
            color: #1e4a6e;
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .submit-btn {
            background: #2c7da0;
            border: none;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 14px 28px;
            border-radius: 48px;
            cursor: pointer;
            margin: 28px 0 20px;
            width: 100%;
            transition: 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .submit-btn:hover {
            background: #1f5e7a;
            transform: scale(0.98);
        }
        .result-area {
            background: #e9f3f7;
            border-radius: 28px;
            padding: 18px 24px;
            margin-top: 15px;
            display: none;
            border-left: 8px solid #2c7da0;
        }
        .score {
            font-size: 1.6rem;
            font-weight: bold;
            color: #155f7c;
        }
        .answer-review {
            margin-top: 20px;
            max-height: 450px;
            overflow-y: auto;
            background: #ffffffd9;
            border-radius: 20px;
            padding: 8px 12px;
        }
        .review-item {
            border-bottom: 1px solid #dce7ef;
            padding: 12px 8px;
        }
        .correct-ans {
            color: #1f8a4c;
            font-weight: 500;
        }
        .user-choice {
            color: #b45353;
        }
        footer {
            text-align: center;
            margin-top: 25px;
            font-size: 0.75rem;
            color: #6c8d9e;
        }
        @media (max-width: 650px) {
            .container {
                padding: 16px;
            }
            .question-card {
                padding: 14px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📘 Chương 1: Giới thiệu về Hệ điều hành</h1>
    <div class="sub">✅ 30 câu trắc nghiệm – Chọn đáp án, sau đó nhấn "Nộp bài" để xem kết quả và đáp án</div>

    <div class="controls">
        <button class="action-btn" id="shuffleBtn">🔀 Xáo trộn câu hỏi</button>
    </div>

    <div id="questions-container"></div>

    <button class="submit-btn" id="submitBtn">📬 NỘP BÀI & XEM ĐÁP ÁN</button>
    <div id="resultArea" class="result-area"></div>
    <footer>Dựa trên nội dung Chương 1 – Introduction (OS definition, history, hardware, concepts, system calls, OS structures)</footer>
</div>

<script>
    // ---------- 30 CÂU HỎI TRẮC NGHIỆM CHƯƠNG 1 ----------
    const questions = [
        { text: "Hệ điều hành (Operating System) là gì?", options: ["Phần mềm duy nhất chạy trên máy tính", "Chương trình trung gian giữa người dùng và phần cứng", "Phần cứng điều khiển CPU", "Ngôn ngữ lập trình bậc cao"], correct: 1 },
        { text: "Theo quan điểm 'máy tính mở rộng' (extended machine), OS có vai trò gì?", options: ["Che giấu chi tiết phức tạp của phần cứng, tạo máy ảo dễ dùng", "Tăng tốc độ xử lý của CPU", "Cung cấp trình biên dịch", "Quản lý cơ sở dữ liệu"], correct: 0 },
        { text: "Thế hệ máy tính đầu tiên (1945–1955) sử dụng công nghệ gì?", options: ["Transistor", "Mạch tích hợp (IC)", "Đèn chân không (vacuum tubes)", "Vi xử lý"], correct: 2 },
        { text: "Hệ điều hành nào tiêu biểu cho thế hệ thứ hai (1955–1965)?", options: ["Windows 95", "UNIX", "FMS (Fortran Monitor System)", "OS/360"], correct: 2 },
        { text: "Đặc điểm nổi bật của thế hệ thứ ba (1965–1980) là gì?", options: ["Xử lý theo lô (batch)", "Đa chương trình (multiprogramming) và chia sẻ thời gian (time-sharing)", "Giao diện đồ họa (GUI)", "Hệ điều hành nhúng"], correct: 1 },
        { text: "Hệ điều hành nào sau đây thuộc loại mainframe OS?", options: ["Windows 10", "OS/390", "Android", "VxWorks"], correct: 1 },
        { text: "Real-time OS (hệ điều hành thời gian thực) được đặc trưng bởi:", options: ["Hỗ trợ nhiều người dùng", "Thời gian đáp ứng là yếu tố then chốt", "Giao diện dòng lệnh", "Chạy trên thẻ thông minh"], correct: 1 },
        { text: "Chế độ nào của CPU cho phép thực thi các lệnh đặc quyền (privileged instructions)?", options: ["User mode", "Kernel mode", "Real mode", "Protected mode"], correct: 1 },
        { text: "Khi một chương trình thực hiện system call, CPU chuyển từ:", options: ["Kernel mode sang user mode", "User mode sang kernel mode", "User mode sang idle mode", "Kernel mode sang supervisor mode"], correct: 1 },
        { text: "Kỹ thuật pipeline trong CPU có tác dụng gì?", options: ["Tăng dung lượng bộ nhớ", "Tăng tốc xử lý lệnh bằng cách thực hiện nhiều giai đoạn đồng thời", "Giảm tiêu thụ điện năng", "Mở rộng tập lệnh"], correct: 1 },
        { text: "Hai thanh ghi đặc biệt dùng để bảo vệ vùng nhớ của các tiến trình là:", options: ["Program Counter và Stack Pointer", "Base register và Limit register", "Data register và Address register", "Control register và Status register"], correct: 1 },
        { text: "Bộ nhớ nào sau đây là bộ nhớ chỉ đọc và thường chứa BIOS?", options: ["RAM", "Cache", "ROM", "CMOS"], correct: 2 },
        { text: "DMA (Direct Memory Access) được sử dụng để:", options: ["Tăng tốc CPU", "Cho phép thiết bị I/O truyền dữ liệu trực tiếp vào bộ nhớ mà không cần CPU", "Quản lý bộ nhớ ảo", "Lưu trữ cấu hình hệ thống"], correct: 1 },
        { text: "Thành phần nào của OS chịu trách nhiệm tạo và hủy tiến trình, đồng bộ hóa và tránh deadlock?", options: ["File management", "Memory management", "Process management", "I/O management"], correct: 2 },
        { text: "Deadlock xảy ra khi:", options: ["Một tiến trình sử dụng CPU quá lâu", "Hai hay nhiều tiến trình mỗi bên giữ một tài nguyên và chờ tài nguyên của bên kia", "Bộ nhớ không đủ", "Hệ thống bị tắt đột ngột"], correct: 1 },
        { text: "System call `fork()` trong UNIX có chức năng gì?", options: ["Tạo một tiến trình con giống hệt tiến trình cha", "Kết thúc tiến trình", "Đọc dữ liệu từ file", "Thay đổi thư mục làm việc"], correct: 0 },
        { text: "Để thay thế hoàn toàn nội dung của tiến trình hiện tại bằng một chương trình mới, ta dùng system call:", options: ["waitpid()", "exit()", "execve()", "kill()"], correct: 2 },
        { text: "Trong POSIX, system call dùng để tạo một thư mục mới là:", options: ["create_dir()", "mkdir()", "newdir()", "rmdir()"], correct: 1 },
        { text: "Trong Win32 API, sự kết hợp nào tương đương với `fork()` + `execve()` của UNIX?", options: ["CreateProcess()", "WaitForSingleObject()", "ReadFile()", "SetCurrentDirectory()"], correct: 0 },
        { text: "Cấu trúc hệ điều hành monolithic (nguyên khối) có đặc điểm:", options: ["Chia thành nhiều lớp, mỗi lớp chỉ gọi lớp dưới", "Tất cả các dịch vụ hệ thống đều nằm trong một khối duy nhất, không phân module rõ ràng", "Hạt nhân cực nhỏ (microkernel), các dịch vụ chạy ở user space", "Ảo hóa toàn bộ phần cứng"], correct: 1 },
        { text: "Hệ điều hành MS-DOS là ví dụ tiêu biểu của cấu trúc:", options: ["Layered", "Virtual machine", "Monolithic", "Client-server"], correct: 2 },
        { text: "Mô hình hệ điều hành THE (Technische Hogeschool Eindhoven) nổi tiếng với cấu trúc:", options: ["Virtual machine", "Layered system", "Microkernel", "Exokernel"], correct: 1 },
        { text: "Trong mô hình client-server (microkernel), giao tiếp giữa các module chính ở user space được thực hiện qua:", options: ["Bộ nhớ dùng chung", "Truyền thông điệp (message passing)", "Biến toàn cục", "Ngắt phần cứng"], correct: 1 },
        { text: "Tiền tố 'Mega' trong hệ mét tương ứng với:", options: ["10³", "10⁶", "10⁹", "10¹²"], correct: 1 },
        { text: "'Giga' là bao nhiêu byte (theo hệ thập phân)?", options: ["1 triệu", "1 tỷ", "1 nghìn tỷ", "1 triệu tỷ"], correct: 1 },
        { text: "Hệ điều hành nào sau đây thuộc loại server operating system?", options: ["Windows Server", "iOS", "VxWorks", "OS/360"], correct: 0 },
        { text: "Lợi ích chính của cấu trúc virtual machine là:", options: ["Tốc độ xử lý cao hơn", "Mỗi người dùng có ảo giác sở hữu một máy tính riêng", "Tiết kiệm bộ nhớ", "Dễ viết driver hơn"], correct: 1 },
        { text: "Thành phần nào của OS quản lý việc ánh xạ file lên bộ nhớ thứ cấp và sao lưu dữ liệu?", options: ["Process management", "File management", "Protection and security", "Secondary storage management"], correct: 1 },
        { text: "Trong sơ đồ phân cấp bộ nhớ, loại bộ nhớ nào có tốc độ nhanh nhất?", options: ["Đĩa cứng", "RAM", "Cache", "Thanh ghi (register)"], correct: 3 },
        { text: "Khi một chương trình gọi hàm `printf()` trong C, cuối cùng nó sẽ dẫn đến system call nào trong UNIX?", options: ["read()", "write()", "open()", "lseek()"], correct: 1 }
    ];

    let currentQuestions = [...questions];

    // Hàm xáo trộn mảng câu hỏi
    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // Render tất cả câu hỏi
    function renderQuestions() {
        const container = document.getElementById('questions-container');
        container.innerHTML = '';
        currentQuestions.forEach((q, idx) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = `q-${idx}`;

            const qNumber = idx + 1;
            const qText = document.createElement('div');
            qText.className = 'question-text';
            qText.innerHTML = `${qNumber}. ${q.text}`;
            card.appendChild(qText);

            const optionsDiv = document.createElement('div');
            optionsDiv.className = 'options';

            q.options.forEach((opt, optIdx) => {
                const optId = `q${idx}_opt${optIdx}`;
                const optionDiv = document.createElement('div');
                optionDiv.className = 'option';

                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.name = `question${idx}`;
                radio.value = optIdx;
                radio.id = optId;

                const label = document.createElement('label');
                label.htmlFor = optId;
                label.textContent = `${String.fromCharCode(65+optIdx)}. ${opt}`; // A., B., C., D.

                optionDiv.appendChild(radio);
                optionDiv.appendChild(label);
                optionsDiv.appendChild(optionDiv);
            });
            card.appendChild(optionsDiv);
            container.appendChild(card);
        });
    }

    // Lấy đáp án người dùng
    function getUserAnswers() {
        const answers = [];
        for (let i = 0; i < currentQuestions.length; i++) {
            const radios = document.querySelectorAll(`input[name="question${i}"]`);
            let selected = null;
            for (let r of radios) {
                if (r.checked) {
                    selected = parseInt(r.value);
                    break;
                }
            }
            answers.push(selected);
        }
        return answers;
    }

    // Hiển thị kết quả và đáp án
    function showResults() {
        const userAnswers = getUserAnswers();
        let correctCount = 0;
        const reviewItems = [];

        for (let i = 0; i < currentQuestions.length; i++) {
            const q = currentQuestions[i];
            const userChoice = userAnswers[i];
            const isCorrect = (userChoice !== null && userChoice === q.correct);
            if (isCorrect) correctCount++;

            let userLetter = userChoice !== null ? String.fromCharCode(65+userChoice) : "❌ Chưa chọn";
            let correctLetter = String.fromCharCode(65+q.correct);
            let correctText = q.options[q.correct];
            let statusText = isCorrect ? "✅ Đúng" : "❌ Sai";

            reviewItems.push(`
                <div class="review-item">
                    <strong>Câu ${i+1}: ${q.text}</strong><br/>
                    <span class="user-choice">📌 Bạn chọn: ${userLetter} ${userChoice !== null ? q.options[userChoice] : '(chưa chọn)'}</span><br/>
                    <span class="correct-ans">✔ Đáp án đúng: ${correctLetter}. ${correctText}</span><br/>
                    <span>${statusText}</span>
                </div>
            `);
        }

        const scorePercent = (correctCount / currentQuestions.length * 100).toFixed(1);
        const resultDiv = document.getElementById('resultArea');
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = `
            <div class="score">🎯 Điểm số: ${correctCount} / ${currentQuestions.length} (${scorePercent}%)</div>
            <div class="answer-review">
                <h3>📖 Chi tiết đáp án:</h3>
                ${reviewItems.join('')}
            </div>
            <button id="resetQuizBtn" style="margin-top:16px; background:#2c7da0; border:none; color:white; padding:8px 24px; border-radius:40px; cursor:pointer;">🔄 Làm lại</button>
        `;
        // Reset toàn bộ
        const resetBtn = document.getElementById('resetQuizBtn');
        if (resetBtn) {
            resetBtn.addEventListener('click', () => {
                const allRadios = document.querySelectorAll('input[type="radio"]');
                allRadios.forEach(radio => radio.checked = false);
                resultDiv.style.display = 'none';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }
    }

    function onSubmit() {
        showResults();
    }

    renderQuestions();
    document.getElementById('submitBtn').addEventListener('click', onSubmit);

    document.getElementById('shuffleBtn').addEventListener('click', () => {
        shuffleArray(currentQuestions);
        renderQuestions();
        document.getElementById('resultArea').style.display = 'none';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });
</script>
</body>
</html>
