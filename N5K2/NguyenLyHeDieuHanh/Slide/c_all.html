<script>
    // ---------- NGÂN HÀNG CÂU HỎI (6 CHƯƠNG, SONG NGỮ) ----------
    // Mỗi câu: textVi, textEn, options (mảng 4 đáp án tiếng Việt), correct (0-3)
    // Để hiển thị song ngữ: câu hỏi tiếng Việt + dòng nhỏ tiếng Anh.
    const rawQuestions = [
        // CHƯƠNG 1: INTRODUCTION (20 câu)
        { textVi: "Hệ điều hành (Operating System) là gì?", textEn: "What is an Operating System?", options: ["Phần mềm duy nhất chạy trên máy tính", "Chương trình trung gian giữa người dùng và phần cứng", "Phần cứng điều khiển CPU", "Ngôn ngữ lập trình bậc cao"], correct: 1,
          explanationVi: "Hệ điều hành (OS) là phần mềm hệ thống hoạt động như một cầu nối (intermediary) giữa người dùng/ứng dụng và phần cứng máy tính. Nguồn gốc khái niệm này xuất phát từ việc phần cứng máy tính cấp thấp cực kỳ phức tạp (mã máy, quản lý thanh ghi). OS cung cấp một 'lớp trừu tượng' giúp phần mềm dễ dàng giao tiếp với phần cứng một cách an toàn và tối ưu.",
          explanationEn: "An Operating System (OS) acts as an intermediary between users/applications and computer hardware. It abstracts the complex, low-level hardware details (like machine code and register management), providing a secure and optimal layer for software to interact with the physical components." },
        { textVi: "Theo quan điểm 'máy tính mở rộng', OS có vai trò gì?", textEn: "As an 'extended machine', what is the role of the OS?", options: ["Che giấu chi tiết phức tạp của phần cứng, tạo máy ảo dễ dùng", "Tăng tốc độ xử lý của CPU", "Cung cấp trình biên dịch", "Quản lý cơ sở dữ liệu"], correct: 0,
          explanationVi: "Quan điểm 'máy tính mở rộng' (Extended/Virtual Machine) nhìn hệ điều hành từ góc độ 'top-down'. OS che giấu những chi tiết phần cứng rắc rối (như truy cập track/sector trên đĩa cứng, quản lý timer, ngắt) và cung cấp cho lập trình viên một cỗ 'máy ảo' tinh gọn, dễ dùng với các khái niệm cấp cao như File, Thư mục, Process.",
          explanationEn: "The 'extended machine' (or Virtual Machine) view looks at the OS from a top-down perspective. It hides messy hardware details (disk sectors, timers, interrupts) and presents a clean, easy-to-use 'virtual machine' featuring high-level concepts like Files, Directories, and Processes." },
        { textVi: "Thế hệ máy tính đầu tiên (1945–1955) sử dụng công nghệ gì?", textEn: "Which technology was used in the first generation (1945–1955)?", options: ["Transistor", "Mạch tích hợp (IC)", "Đèn chân không (vacuum tubes)", "Vi xử lý"], correct: 2,
          explanationVi: "Thế hệ máy tính đầu tiên sử dụng bóng đèn chân không (vacuum tubes) khổng lồ, tiêu thụ cực nhiều điện năng. Thời kỳ này <strong>chưa hề có khái niệm hệ điều hành</strong>. Các kỹ sư phải lập trình thủ công bằng mã máy thông qua việc nối dây vật lý trên các bảng cắm (plugboards).",
          explanationEn: "The first computer generation used massive vacuum tubes that consumed huge amounts of power. In this era, <strong>operating systems did not exist</strong>. Engineers programmed in absolute machine code by physically connecting wires on plugboards." },
        { textVi: "Hệ điều hành nào tiêu biểu cho thế hệ thứ hai (1955–1965)?", textEn: "Which OS is typical for the second generation?", options: ["Windows 95", "UNIX", "FMS (Fortran Monitor System)", "OS/360"], correct: 2,
          explanationVi: "Thế hệ thứ hai chứng kiến sự ra đời của bóng bán dẫn (Transistor). Vì thời gian thuê máy (mainframe) rất đắt đỏ, các kỹ sư đã phát minh ra Hệ thống xử lý theo lô (Batch System) để gom các công việc (jobs) vào băng từ và chạy tự động tuần tự, tránh lãng phí thời gian CPU. FMS (Fortran Monitor System) và IBSYS là các OS xử lý lô tiêu biểu nhất thời này.",
          explanationEn: "The second generation introduced transistors. Because mainframe computer time was extremely expensive, Batch Systems were invented to group jobs on magnetic tapes and run them automatically to avoid CPU idle time. FMS and IBSYS were typical early batch OSs." },
        { textVi: "Đặc điểm nổi bật của thế hệ thứ ba (1965–1980) là gì?", textEn: "What is the key feature of the third generation (1965–1980)?", options: ["Xử lý theo lô (batch)", "Đa chương trình (multiprogramming) và chia sẻ thời gian (time-sharing)", "Giao diện đồ họa (GUI)", "Hệ điều hành nhúng"], correct: 1,
          explanationVi: "Thế hệ thứ 3 sử dụng Mạch tích hợp (IC). Hai phát minh cách mạng là: 1) <strong>Đa chương trình (Multiprogramming)</strong>: Nạp nhiều job vào RAM, nếu một job đợi I/O, CPU sẽ chuyển sang chạy job khác để tối đa hóa hiệu suất; 2) <strong>Time-sharing</strong>: Phân chia thời gian CPU nhanh đến mức nhiều người dùng qua thiết bị đầu cuối (terminals) cảm giác như họ đang sở hữu toàn bộ máy tính. Hệ điều hành UNIX ra đời trong giai đoạn này.",
          explanationEn: "The third generation used Integrated Circuits (ICs). Key innovations: 1) <strong>Multiprogramming</strong>: Keeping multiple jobs in RAM so the CPU can switch tasks if one waits for I/O. 2) <strong>Time-sharing</strong>: Sharing CPU time so rapidly that multiple terminal users feel they have dedicated access to the computer. UNIX was born in this era." },
        { textVi: "Hệ điều hành nào thuộc loại mainframe OS?", textEn: "Which is a mainframe OS?", options: ["Windows 10", "OS/390", "Android", "VxWorks"], correct: 1 },
        { textVi: "Real-time OS được đặc trưng bởi yếu tố nào?", textEn: "What characterizes a Real-time OS?", options: ["Hỗ trợ nhiều người dùng", "Thời gian đáp ứng là yếu tố then chốt", "Giao diện dòng lệnh", "Chạy trên thẻ thông minh"], correct: 1 },
        { textVi: "Chế độ nào của CPU cho phép thực thi lệnh đặc quyền (privileged instructions)?", textEn: "Which CPU mode allows privileged instructions?", options: ["User mode", "Kernel mode", "Real mode", "Protected mode"], correct: 1 },
        { textVi: "Khi thực hiện system call, CPU chuyển từ chế độ nào sang chế độ nào?", textEn: "When a system call is made, the CPU switches from:", options: ["Kernel mode → user mode", "User mode → kernel mode", "User mode → idle mode", "Kernel mode → supervisor mode"], correct: 1 },
        { textVi: "Kỹ thuật pipeline trong CPU có tác dụng gì?", textEn: "What does pipelining in a CPU do?", options: ["Tăng dung lượng bộ nhớ", "Tăng tốc xử lý lệnh bằng cách thực hiện nhiều giai đoạn đồng thời", "Giảm tiêu thụ điện năng", "Mở rộng tập lệnh"], correct: 1 },
        { textVi: "Hai thanh ghi dùng để bảo vệ vùng nhớ tiến trình là:", textEn: "Two registers used to protect memory regions are:", options: ["PC và SP", "Base và Limit", "Data và Address", "Control và Status"], correct: 1 },
        { textVi: "Bộ nhớ nào sau đây là bộ nhớ chỉ đọc và chứa BIOS?", textEn: "Which memory is read-only and contains BIOS?", options: ["RAM", "Cache", "ROM", "CMOS"], correct: 2 },
        { textVi: "DMA (Direct Memory Access) được dùng để:", textEn: "DMA is used to:", options: ["Tăng tốc CPU", "Cho phép thiết bị I/O truyền dữ liệu trực tiếp với bộ nhớ không qua CPU", "Quản lý bộ nhớ ảo", "Lưu cấu hình hệ thống"], correct: 1 },
        { textVi: "Thành phần nào của OS tạo và hủy tiến trình, đồng bộ hóa?", textEn: "Which OS component handles process creation, termination and synchronization?", options: ["File management", "Memory management", "Process management", "I/O management"], correct: 2 },
        { textVi: "Deadlock xảy ra khi nào?", textEn: "When does deadlock occur?", options: ["Một tiến trình dùng CPU quá lâu", "Hai hay nhiều tiến trình mỗi bên giữ tài nguyên và chờ tài nguyên của bên kia", "Bộ nhớ không đủ", "Hệ thống tắt đột ngột"], correct: 1 },
        { textVi: "System call `fork()` trong UNIX dùng để:", textEn: "What does UNIX `fork()` do?", options: ["Tạo tiến trình con giống hệt tiến trình cha", "Kết thúc tiến trình", "Đọc dữ liệu từ file", "Đổi thư mục làm việc"], correct: 0 },
        { textVi: "Để thay thế hoàn toàn tiến trình hiện tại bằng chương trình mới, dùng system call:", textEn: "Which system call replaces the current process with a new program?", options: ["waitpid()", "exit()", "execve()", "kill()"], correct: 2 },
        { textVi: "Cấu trúc monolithic có đặc điểm gì?", textEn: "What is a characteristic of a monolithic OS structure?", options: ["Chia thành nhiều lớp", "Tất cả dịch vụ hệ thống nằm trong một khối, không phân module rõ ràng", "Hạt nhân cực nhỏ (microkernel)", "Ảo hóa phần cứng"], correct: 1 },
        { textVi: "Trong mô hình client-server (microkernel), giao tiếp giữa các module ở user space qua:", textEn: "In the client-server (microkernel) model, communication between user-space modules uses:", options: ["Bộ nhớ dùng chung", "Truyền thông điệp (message passing)", "Biến toàn cục", "Ngắt phần cứng"], correct: 1 },
        { textVi: "Tiền tố 'Giga' tương ứng với bao nhiêu byte?", textEn: "How many bytes does 'Giga' represent?", options: ["1 triệu", "1 tỷ", "1 nghìn tỷ", "1 triệu tỷ"], correct: 1 },
        // CHƯƠNG 2: PROCESSES & THREADS (25 câu)
        { textVi: "Process là gì?", textEn: "What is a process?", options: ["Một chương trình đang thực thi", "Một file trên đĩa", "Một thư mục", "Một thiết bị I/O"], correct: 0 },
        { textVi: "Trạng thái nào thể hiện process đang chờ một sự kiện (ví dụ I/O)?", textEn: "Which state indicates a process is waiting for an event (e.g., I/O)?", options: ["Ready", "Running", "Waiting", "Terminated"], correct: 2 },
        { textVi: "Thành phần nào KHÔNG nằm trong PCB?", textEn: "Which is NOT part of the PCB?", options: ["Program Counter", "Nội dung file thực thi (mã lệnh)", "CPU Registers", "Process state"], correct: 1 },
        { textVi: "System call tạo tiến trình mới trong Unix là:", textEn: "System call to create a new process in Unix:", options: ["exec()", "fork()", "wait()", "exit()"], correct: 1 },
        { textVi: "Điều nào đúng về phân cấp tiến trình trong Unix?", textEn: "Which is true about process hierarchy in Unix?", options: ["Không có khái niệm cha-con", "Mọi tiến trình đều bình đẳng", "Parent tạo child, tạo thành cây", "Chỉ có một tiến trình duy nhất"], correct: 2 },
        { textVi: "Lợi ích nào KHÔNG phải của thread so với process?", textEn: "Which is NOT a benefit of threads over processes?", options: ["Responsiveness", "Resource sharing", "Bảo vệ bộ nhớ tốt hơn", "Economy"], correct: 2 },
        { textVi: "Trong user-level threads, kernel có biết về các thread không?", textEn: "In user-level threads, does the kernel know about threads?", options: ["Có, kernel quản lý từng thread", "Không, kernel chỉ thấy một process", "Chỉ biết nếu thread tạo bằng clone()", "Tùy thuộc"], correct: 1 },
        { textVi: "Giải thuật Round Robin thuộc loại điều phối nào?", textEn: "Round Robin is which type of scheduling?", options: ["Non-preemptive", "Preemptive", "FCFS", "Priority"], correct: 1 },
        { textVi: "Hiện tượng 'convoy effect' xảy ra trong giải thuật nào?", textEn: "Which algorithm suffers from 'convoy effect'?", options: ["Round Robin", "SJF", "FCFS", "Priority"], correct: 2 },
        { textVi: "Giải thuật tối ưu turnaround time nếu biết trước thời gian thực thi:", textEn: "Which algorithm minimizes turnaround time if burst times are known?", options: ["FCFS", "Round Robin", "SJF", "Priority"], correct: 2 },
        { textVi: "Starvation trong priority scheduling có thể giải quyết bằng:", textEn: "Starvation in priority scheduling can be solved by:", options: ["Tăng time quantum", "Aging", "Dùng FCFS", "Tắt preemption"], correct: 1 },
        { textVi: "Race condition là gì?", textEn: "What is a race condition?", options: ["Khi hai process cùng chạy song song an toàn", "Kết quả phụ thuộc vào thứ tự thực thi không kiểm soát được", "CPU không đủ nhanh", "Bộ nhớ bị tràn"], correct: 1 },
        { textVi: "Peterson's solution dùng để:", textEn: "Peterson's solution is used for:", options: ["Tránh deadlock", "Mutual exclusion cho 2 process", "Điều phối CPU", "Quản lý bộ nhớ"], correct: 1 },
        { textVi: "Semaphore, thao tác Down(S) (P) được định nghĩa:", textEn: "Semaphore Down(S) (P) operation:", options: ["S.value++; if <=0 sleep", "S.value--; if <0 sleep", "S.value = 0; sleep", "S.value = 1; wakeup"], correct: 1 },
        { textVi: "Monitor là cấu trúc đồng bộ hóa, đặc điểm nào đúng?", textEn: "Which is true about monitors?", options: ["Do kernel quản lý hoàn toàn", "Tự động mutual exclusion, dùng condition variable", "Không giải quyết được Producer-Consumer", "Chỉ đơn CPU"], correct: 1 },
        { textVi: "Context switch là hành động:", textEn: "Context switch is:", options: ["Lưu trạng thái tiến trình cũ và nạp trạng thái mới", "Tắt CPU", "Gọi hàm hệ thống", "Khởi tạo bảng phân trang"], correct: 0 },
        { textVi: "Một process có 3 threads. Điều nào được chia sẻ giữa các thread?", textEn: "Which is shared among threads of the same process?", options: ["Program counter", "Stack", "Global variables", "Thanh ghi riêng"], correct: 2 },
        { textVi: "Sleep & wakeup cần sự hỗ trợ từ:", textEn: "Sleep & wakeup require support from:", options: ["Phần cứng", "Hệ điều hành", "Trình biên dịch", "CPU"], correct: 1 },

        { textVi: "Phục hồi deadlock bằng rollback cần:", textEn: "Rollback recovery requires:", options: ["Checkpoint định kỳ", "Preemption", "Killing process", "Khởi động lại"], correct: 0 },
        { textVi: "Banker's algorithm đảm bảo hệ thống luôn ở:", textEn: "Banker's algorithm ensures the system stays in:", options: ["Deadlock state", "Safe state", "Unsafe state", "Idle state"], correct: 1 },
        { textVi: "Safe state khác unsafe state ở điểm:", textEn: "Safe state differs from unsafe state in that:", options: ["Safe state không deadlock, unsafe state có thể deadlock", "Unsafe state không deadlock", "Safe state luôn có deadlock", "Không khác"], correct: 0 },
        { textVi: "Để ngăn ngừa deadlock, tấn công điều kiện 'hold and wait' bằng cách:", textEn: "To prevent deadlock by attacking 'hold and wait', we can:", options: ["Spooling", "Request all resources initially", "Preemption", "Order resources"], correct: 1 },
        { textVi: "Spooling nhằm loại bỏ điều kiện nào?", textEn: "Spooling aims to eliminate which condition?", options: ["Mutual exclusion", "Hold and wait", "No preemption", "Circular wait"], correct: 0 },
        { textVi: "Preemption (tước tài nguyên) khó áp dụng với:", textEn: "Preemption is difficult for:", options: ["CPU", "Máy in đang in", "Bộ nhớ", "Cache"], correct: 1 },
        { textVi: "Two-phase locking thường dùng trong:", textEn: "Two-phase locking is commonly used in:", options: ["Hệ thống file", "Cơ sở dữ liệu", "Lập lịch CPU", "Mạng"], correct: 1 },
        { textVi: "Trong two-phase locking, nếu không khóa được tất cả, process sẽ:", textEn: "In two-phase locking, if cannot lock all needed items, process will:", options: ["Chờ", "Giải phóng khóa và bắt đầu lại", "Tiếp tục", "Deadlock"], correct: 1 },
        { textVi: "Non-resource deadlock có thể xảy ra với:", textEn: "Non-resource deadlock can occur with:", options: ["Semaphore", "File", "Disk", "Printer"], correct: 0 },
        { textVi: "Starvation (đói) là gì?", textEn: "What is starvation?", options: ["Process bị hoãn vô hạn dù không deadlock", "Deadlock", "Thiếu tài nguyên", "Lỗi phần cứng"], correct: 0 },
        { textVi: "Giải pháp đơn giản cho starvation là:", textEn: "Simple solution for starvation is:", options: ["FCFS scheduling", "Priority scheduling", "Round Robin", "SJF"], correct: 0 },
        { textVi: "Trong RAG, một chu trình với tài nguyên nhiều instance:", textEn: "In RAG, a cycle with multi-instance resources:", options: ["Chắc chắn deadlock", "Chưa chắc deadlock", "Không thể có chu trình", "Luôn an toàn"], correct: 1 },
        { textVi: "Banker's algorithm yêu cầu biết trước:", textEn: "Banker's algorithm requires knowing in advance:", options: ["Tốc độ CPU", "Nhu cầu tối đa của mỗi process", "Thời gian thực thi", "Số lượng người dùng"], correct: 1 },
        { textVi: "Khi phát hiện deadlock, phương pháp 'killing process' có ưu điểm:", textEn: "Advantage of 'killing process' for deadlock recovery:", options: ["Đơn giản, dễ cài đặt", "Không mất dữ liệu", "Nhanh nhất", "Tối ưu"], correct: 0 },
        { textVi: "Deadlock avoidance khác prevention ở chỗ:", textEn: "Deadlock avoidance differs from prevention in that:", options: ["Avoidance cần biết trước yêu cầu tối đa", "Prevention hiệu quả hơn", "Avoidance không cần điều kiện", "Prevention không khả thi"], correct: 0 },
        { textVi: "Trong deadlock detection, thuật toán kết thúc khi:", textEn: "In deadlock detection, the algorithm terminates when:", options: ["Tất cả process được đánh dấu hoặc không còn process nào thỏa mãn", "Có deadlock", "Hết thời gian", "Tài nguyên đầy"], correct: 0 },
        { textVi: "Điều kiện 'no preemption' có nghĩa:", textEn: "No preemption condition means:", options: ["Tài nguyên có thể bị tước", "Tài nguyên không thể bị tước", "Process ưu tiên cao hơn được tước", "Chỉ kernel mới tước được"], correct: 1 },
        { textVi: "Trong Banker's algorithm, nếu yêu cầu dẫn đến unsafe state:", textEn: "In Banker's algorithm, if a request leads to unsafe state:", options: ["Được cấp", "Bị từ chối (hoãn)", "Chấp nhận rủi ro", "Tự động kill process"], correct: 1 },
        { textVi: "Deadlock khác livelock ở điểm:", textEn: "Deadlock differs from livelock in that:", options: ["Deadlock: các process không thay đổi trạng thái; livelock: thay đổi nhưng không tiến triển", "Livelock nguy hiểm hơn", "Deadlock chỉ xảy ra với tài nguyên", "Livelock chỉ xảy ra với CPU"], correct: 0 }
    ];

    // Tổng số câu
    const allQuestions = [...rawQuestions];
    // Xáo trộn ngẫu nhiên
    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }
    const shuffledQuestions = shuffleArray([...allQuestions]);

    // Render
    function renderQuestions() {
        const container = document.getElementById('questions-container');
        container.innerHTML = '';
        shuffledQuestions.forEach((q, idx) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = `q-${idx}`;
            const qNumber = idx + 1;
            const qTextDiv = document.createElement('div');
            qTextDiv.className = 'question-text lang-vi';
            qTextDiv.innerHTML = `${qNumber}. ${q.textVi}`;
            const qEnDiv = document.createElement('div');
            qEnDiv.className = 'question-text lang-en';
            qEnDiv.innerHTML = `🇬🇧 ${qNumber}. ${q.textEn}`;
            card.appendChild(qTextDiv);
            card.appendChild(qEnDiv);
            const optionsDiv = document.createElement('div');
            optionsDiv.className = 'options';
            q.options.forEach((opt, optIdx) => {
                const optId = `q${idx}_opt${optIdx}`;
                const optionDiv = document.createElement('div');
                optionDiv.className = 'option';
                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.name = `question${idx}`;
                radio.value = optIdx;
                radio.id = optId;
                const label = document.createElement('label');
                label.htmlFor = optId;
                label.textContent = `${String.fromCharCode(65+optIdx)}. ${opt}`;
                optionDiv.appendChild(radio);
                optionDiv.appendChild(label);
                optionsDiv.appendChild(optionDiv);
            });
            card.appendChild(optionsDiv);
            container.appendChild(card);
        });
        document.getElementById('questionCountSpan').innerText = shuffledQuestions.length;
    }

    function getUserAnswers() {
        const answers = [];
        for (let i = 0; i < shuffledQuestions.length; i++) {
            const radios = document.querySelectorAll(`input[name="question${i}"]`);
            let selected = null;
            for (let r of radios) {
                if (r.checked) {
                    selected = parseInt(r.value);
                    break;
                }
            }
            answers.push(selected);
        }
        return answers;
    }

    function showResults() {
        const userAnswers = getUserAnswers();
        let correctCount = 0;
        const reviewItems = [];
        for (let i = 0; i < shuffledQuestions.length; i++) {
            const q = shuffledQuestions[i];
            const userChoice = userAnswers[i];
            const isCorrect = (userChoice !== null && userChoice === q.correct);
            if (isCorrect) correctCount++;
            let userLetter = userChoice !== null ? String.fromCharCode(65+userChoice) : "❌ Chưa chọn";
            let correctLetter = String.fromCharCode(65+q.correct);
            let correctText = q.options[q.correct];
            let statusText = isCorrect ? "✅ Đúng" : "❌ Sai";

            let expVi = q.explanationVi ? `<div class="lang-vi" style="margin-top: 8px;">💡 <strong>Kiến thức & Giải thích:</strong> ${q.explanationVi}</div>` : '';
            let expEn = q.explanationEn ? `<div class="lang-en" style="margin-top: 8px;">💡 <strong>Knowledge & Explanation:</strong> ${q.explanationEn}</div>` : '';

            reviewItems.push(`
                <div class="review-item">
                    <div style="margin-bottom: 6px;">
                        <strong class="lang-vi">Câu ${i+1}: ${q.textVi}</strong>
                        <strong class="lang-en">Question ${i+1}: ${q.textEn}</strong>
                    </div>
                    <span class="user-choice">📌 Bạn chọn: ${userLetter} ${userChoice !== null ? q.options[userChoice] : '(chưa chọn)'}</span><br/>
                    <span class="correct-ans">✔ Đáp án đúng: ${correctLetter}. ${correctText}</span><br/>
                    <span>${statusText}</span>
                    ${(expVi || expEn) ? `<div class="explanation">${expVi}${expEn}</div>` : ''}
                </div>
            `);
        }
        const scorePercent = (correctCount / shuffledQuestions.length * 100).toFixed(1);
        const resultDiv = document.getElementById('resultArea');
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = `
            <div class="score">🎯 Điểm số: ${correctCount} / ${shuffledQuestions.length} (${scorePercent}%)</div>
            <div class="answer-review">
                <h3>📖 Chi tiết đáp án:</h3>
                ${reviewItems.join('')}
            </div>
            <button id="resetQuizBtn" style="margin-top:16px; background:#2c7da0; border:none; color:white; padding:8px 24px; border-radius:40px; cursor:pointer;">🔄 Làm lại (giữ nguyên câu hỏi)</button>
        `;
        const resetBtn = document.getElementById('resetQuizBtn');
        if (resetBtn) {
            resetBtn.addEventListener('click', () => {
                const allRadios = document.querySelectorAll('input[type="radio"]');
                allRadios.forEach(radio => radio.checked = false);
                resultDiv.style.display = 'none';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }
    }

    function toggleLanguage() {
        const body = document.body;
        const btn = document.getElementById('langBtn');
        const currentLang = body.getAttribute('data-lang');

        if (currentLang === 'bilingual') {
            body.setAttribute('data-lang', 'vi');
            btn.innerHTML = 'Ngôn ngữ: Tiếng Việt';
        } else if (currentLang === 'vi') {
            body.setAttribute('data-lang', 'en');
            btn.innerHTML = 'Language: English';
        } else {
            body.setAttribute('data-lang', 'bilingual');
            btn.innerHTML = 'Ngôn ngữ: Song ngữ / Bilingual';
        }
    }

    function onSubmit() {
        showResults();
    }

    renderQuestions();
    document.getElementById('submitBtn').addEventListener('click', onSubmit);

    document.getElementById('shuffleBtn').addEventListener('click', () => {
        shuffleArray(shuffledQuestions);
        renderQuestions();
        document.getElementById('resultArea').style.display = 'none';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });
</script>
</body>
</html>
