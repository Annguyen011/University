<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Quiz Chapter 2: Processes and Threads</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; color: #1a2a3a; }
        .container { max-width: 1000px; margin: 0 auto; background: white; border-radius: 28px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); padding: 20px 24px 32px; }
        h1 { font-size: 1.9rem; margin-top: 0; margin-bottom: 0.25rem; color: #0a4b6e; border-left: 6px solid #0a4b6e; padding-left: 20px; }
        .sub { color: #4b6f86; margin-bottom: 28px; border-bottom: 1px solid #e2e8f0; padding-bottom: 12px; padding-left: 26px; }
        .question-card { background: #ffffff; border-radius: 20px; padding: 18px 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 1px solid #e4edf2; }
        .question-text { font-weight: 600; font-size: 1.1rem; margin-bottom: 14px; color: #0b2b3b; }
        .options { display: flex; flex-direction: column; gap: 10px; padding-left: 8px; }
        .option { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 40px; background: #f9fafc; border: 1px solid #e2edf2; }
        .option:hover { background: #eef3fa; }
        input[type="radio"] { width: 18px; height: 18px; accent-color: #2c7da0; cursor: pointer; }
        .option label { flex: 1; cursor: pointer; color: #1e4a6e; font-size: 0.95rem; }
        .submit-btn { background: #2c7da0; border: none; color: white; font-size: 1.2rem; font-weight: bold; padding: 14px 28px; border-radius: 48px; cursor: pointer; width: 100%; margin: 28px 0 20px; }
        .submit-btn:hover { background: #1f5e7a; }
        .result-area { background: #e9f3f7; border-radius: 28px; padding: 18px 24px; display: none; border-left: 8px solid #2c7da0; }
        .score { font-size: 1.6rem; font-weight: bold; color: #155f7c; }
        .answer-review { margin-top: 20px; max-height: 400px; overflow-y: auto; background: #ffffffd9; border-radius: 20px; padding: 8px 12px; }
        .review-item { border-bottom: 1px solid #dce7ef; padding: 12px 8px; }
        .correct-ans { color: #1f8a4c; font-weight: 500; }
        .user-choice { color: #b45353; }
        footer { text-align: center; margin-top: 25px; font-size: 0.75rem; color: #6c8d9e; }
    </style>
</head>
<body>
<div class="container">
    <h1>📘 Chapter 2: Processes & Threads</h1>
    <div class="sub">✅ 25 multiple-choice questions – Choose your answer, then click "Submit" to see results.</div>

    <div id="questions-container"></div>
    <button class="submit-btn" id="submitBtn">📬 SUBMIT & VIEW ANSWERS</button>
    <div id="resultArea" class="result-area"></div>
    <footer>Based on Chapter 2 – Processes, Threads, Scheduling, IPC</footer>
</div>

<script>
    const questions = [
        { text: "What is a process in an operating system?", options: ["A program in execution", "An executable file on disk", "A control panel", "A peripheral device"], correct: 0 },
        { text: "Which process state indicates it is waiting for an event (e.g., I/O)?", options: ["Ready", "Running", "Waiting", "Terminated"], correct: 2 },
        { text: "Which component is NOT located in the Process Control Block (PCB)?", options: ["Program Counter", "Executable file content (source code)", "CPU Registers", "Process state"], correct: 1 },
        { text: "In Unix, the system call used to create a new process (a clone) is:", options: ["exec()", "fork()", "wait()", "exit()"], correct: 1 },
        { text: "Which is true about process hierarchy in Unix?", options: ["There is no parent-child concept", "All processes are equal", "A parent creates a child, forming a tree", "There is only one single process"], correct: 2 },
        { text: "Which is NOT a benefit of a thread compared to a process?", options: ["Responsiveness", "Resource sharing", "Better memory protection", "Economy (saves resources)"], correct: 2 },
        { text: "In the user-level threads model, is the kernel aware of the threads?", options: ["Yes, the kernel manages each thread", "No, the kernel only sees a single process", "Only if the thread is created using clone()", "Depends on the OS"], correct: 1 },
        { text: "The Round Robin (RR) scheduling algorithm belongs to which type?", options: ["Non-preemptive", "Preemptive", "First-Come-First-Served", "Pure Priority Scheduling"], correct: 1 },
        { text: "The 'convoy effect' (short processes blocked by a long one) occurs in which algorithm?", options: ["Round Robin", "SJF", "FCFS", "Priority"], correct: 2 },
        { text: "Which algorithm optimizes turnaround time if the execution time is known in advance?", options: ["FCFS", "Round Robin", "SJF (Shortest Job First)", "Priority Scheduling"], correct: 2 },
        { text: "Starvation in priority scheduling can be resolved by:", options: ["Increasing time quantum", "Aging (gradually increasing priority over wait time)", "Using FCFS", "Disabling preemption"], correct: 1 },
        { text: "What is a race condition?", options: ["When two processes run concurrently safely", "When the outcome depends on the uncontrollable order of execution", "When the CPU isn't fast enough", "When memory overflows"], correct: 1 },
        { text: "Which of the following is NOT one of the four conditions for mutual exclusion?", options: ["No two processes can be simultaneously inside their critical regions", "A process must run as fast as possible", "No process running outside its critical region may block other processes", "No process should have to wait forever to enter its critical region"], correct: 1 },
        { text: "The TSL (Test and Set Lock) instruction is a hardware mechanism that helps to:", options: ["Reduce memory usage", "Atomically test and set a lock", "Speed up the CPU clock", "Completely replace semaphores"], correct: 1 },
        { text: "In Semaphore synchronization, the Down(S) (or P) operation is typically defined as:", options: ["S.value++; if S.value <= 0 sleep", "S.value--; if S.value < 0 sleep", "S.value = 0; sleep", "S.value = 1; wakeup"], correct: 1 },
        { text: "Peterson’s solution for mutual exclusion with 2 processes requires:", options: ["A turn variable and an interest[] array", "Only one lock variable", "Two semaphores", "Distributed memory"], correct: 0 },
        { text: "Which characteristic is true for a Monitor (a high-level synchronization construct)?", options: ["Managed completely by the kernel", "Automatically ensures mutual exclusion, uses condition variables", "Cannot solve the Producer-Consumer problem", "Only works in single CPU systems"], correct: 1 },
        { text: "In the Bounded Buffer (Producer-Consumer) problem, semaphores are typically used to:", options: ["Synchronize buffer access and count elements", "Replace main memory", "Increase production speed", "Prevent all concurrency"], correct: 0 },
        { text: "A hard real-time system requires:", options: ["Task completion within an absolute guaranteed time", "Low priority execution", "No scheduling", "Round Robin only"], correct: 0 },
        { text: "Context switch is the action of:", options: ["Saving the old process state and loading the new process state", "Turning off the CPU", "Calling a system function", "Initializing the page table"], correct: 0 },
        { text: "A process has 3 threads. What is shared among them?", options: ["Program counter", "Stack", "Global variables", "Private registers"], correct: 2 },
        { text: "In the 'sleep and wakeup' technique to avoid busy waiting, what is needed?", options: ["OS support (sleep, wakeup system calls)", "CPU must execute an infinite loop", "No conditions required", "Only applies to 1 process"], correct: 0 },
        { text: "Multilevel queue scheduling is typically used to:", options: ["Categorize processes by priority or type (e.g. interactive, batch)", "Maintain a single queue", "Completely eliminate preemption", "Run all processes with equal time quantum"], correct: 0 },
        { text: "In the kernel-level threads model, which statement is true?", options: ["The kernel is unaware of threads", "Context switch cost is lower than user-level threads", "Each thread is an independent scheduling entity managed by the kernel", "A blocked thread blocks the entire parent process"], correct: 2 },
        { text: "Race conditions can be prevented by ensuring:", options: ["Mutual exclusion", "Increased CPU speed", "Reduced number of processes", "Using virtual memory"], correct: 0 }
    ];

    questions.forEach(q => {
        let opts = q.options.map((text, idx) => ({text, isCorrect: idx === q.correct}));
        for (let i = opts.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [opts[i], opts[j]] = [opts[j], opts[i]];
        }
        q.options = opts.map(o => o.text);
        q.correct = opts.findIndex(o => o.isCorrect);
    });

    let currentQuestions = [...questions];
    for (let i = currentQuestions.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [currentQuestions[i], currentQuestions[j]] = [currentQuestions[j], currentQuestions[i]];
    }

    function renderQuestions() {
        const container = document.getElementById('questions-container');
        container.innerHTML = '';
        currentQuestions.forEach((q, idx) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.innerHTML = `<div class="question-text">${idx + 1}. ${q.text}</div>`;
            
            const optionsDiv = document.createElement('div');
            optionsDiv.className = 'options';
            q.options.forEach((opt, optIdx) => {
                optionsDiv.innerHTML += `
                <div class="option">
                    <input type="radio" name="q${idx}" value="${optIdx}" id="q${idx}o${optIdx}">
                    <label for="q${idx}o${optIdx}">${String.fromCharCode(65+optIdx)}. ${opt}</label>
                </div>`;
            });
            card.appendChild(optionsDiv);
            container.appendChild(card);
        });
    }

    document.getElementById('submitBtn').addEventListener('click', () => {
        let correctCount = 0;
        const reviewItems = [];
        currentQuestions.forEach((q, i) => {
            const selected = document.querySelector(`input[name="q${i}"]:checked`);
            const choice = selected ? parseInt(selected.value) : null;
            if (choice === q.correct) correctCount++;
            
            reviewItems.push(`
                <div class="review-item">
                    <strong>Q${i+1}: ${q.text}</strong><br/>
                    <span class="user-choice">📌 Your choice: ${choice !== null ? String.fromCharCode(65+choice) + '. ' + q.options[choice] : 'Not selected'}</span><br/>
                    <span class="correct-ans">✔ Correct: ${String.fromCharCode(65+q.correct)}. ${q.options[q.correct]}</span><br/>
                    <span>${choice === q.correct ? '✅ Correct' : '❌ Incorrect'}</span>
                </div>`);
        });

        const resArea = document.getElementById('resultArea');
        resArea.style.display = 'block';
        resArea.innerHTML = `
            <div class="score">🎯 Score: ${correctCount} / ${currentQuestions.length}</div>
            <div class="answer-review">${reviewItems.join('')}</div>
            <button id="resetBtn" style="margin-top:16px; background:#2c7da0; border:none; color:white; padding:8px 24px; border-radius:40px; cursor:pointer;">🔄 Retry</button>`;
        
        document.getElementById('resetBtn').addEventListener('click', () => {
            document.querySelectorAll('input[type="radio"]').forEach(r => r.checked = false);
            resArea.style.display = 'none';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    });
    renderQuestions();
</script>
</body>
</html>
