<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Trắc nghiệm Chương 2: Processes and Threads</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 20px;
            color: #1a2a3a;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 28px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
            overflow: hidden;
            padding: 20px 24px 32px;
        }
        h1 {
            font-size: 1.9rem;
            margin-top: 0;
            margin-bottom: 0.25rem;
            color: #0a4b6e;
            border-left: 6px solid #0a4b6e;
            padding-left: 20px;
        }
        .sub {
            color: #4b6f86;
            margin-bottom: 28px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 12px;
            padding-left: 26px;
        }
        .question-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 18px 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid #e4edf2;
            transition: all 0.1s ease;
        }
        .question-text {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 14px;
            color: #0b2b3b;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-left: 8px;
        }
        .option {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 40px;
            background: #f9fafc;
            transition: background 0.2s;
            border: 1px solid #e2edf2;
        }
        .option:hover {
            background: #eef3fa;
        }
        input[type="radio"] {
            width: 18px;
            height: 18px;
            accent-color: #2c7da0;
            margin: 0;
            cursor: pointer;
        }
        .option label {
            flex: 1;
            cursor: pointer;
            font-weight: normal;
            color: #1e4a6e;
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .submit-btn {
            background: #2c7da0;
            border: none;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 14px 28px;
            border-radius: 48px;
            cursor: pointer;
            margin: 28px 0 20px;
            width: 100%;
            transition: 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .submit-btn:hover {
            background: #1f5e7a;
            transform: scale(0.98);
        }
        .result-area {
            background: #e9f3f7;
            border-radius: 28px;
            padding: 18px 24px;
            margin-top: 15px;
            display: none;
            border-left: 8px solid #2c7da0;
        }
        .score {
            font-size: 1.6rem;
            font-weight: bold;
            color: #155f7c;
        }
        .answer-review {
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
            background: #ffffffd9;
            border-radius: 20px;
            padding: 8px 12px;
        }
        .review-item {
            border-bottom: 1px solid #dce7ef;
            padding: 12px 8px;
        }
        .correct-ans {
            color: #1f8a4c;
            font-weight: 500;
        }
        .user-choice {
            color: #b45353;
        }
        .badge {
            display: inline-block;
            background: #eef2f5;
            border-radius: 30px;
            padding: 2px 12px;
            font-size: 0.75rem;
            margin-left: 12px;
            font-weight: normal;
        }
        footer {
            text-align: center;
            margin-top: 25px;
            font-size: 0.75rem;
            color: #6c8d9e;
        }
        @media (max-width: 650px) {
            .container {
                padding: 16px;
            }
            .question-card {
                padding: 14px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📘 Chương 2: Processes & Threads</h1>
    <div class="sub">✅ 25 câu trắc nghiệm – Chọn đáp án đúng, sau đó nhấn "Nộp bài" để xem kết quả</div>

    <div id="questions-container"></div>

    <button class="submit-btn" id="submitBtn">📬 NỘP BÀI & XEM ĐÁP ÁN</button>
    <div id="resultArea" class="result-area"></div>
    <footer>Dựa trên nội dung Chương 2 – Processes, Threads, Scheduling, IPC</footer>
</div>

<script>
    // ---------- DANH SÁCH CÂU HỎI (CHƯƠNG 2) ----------
    // Mỗi câu: text, options (mảng 4 đáp án), correct (0-3)
    const questions = [
        { text: "Process là gì trong hệ điều hành?", options: ["Một chương trình đang thực thi", "Một file thực thi trên đĩa", "Một bảng điều khiển", "Một thiết bị ngoại vi"], correct: 0 },
        { text: "Trạng thái nào của process thể hiện nó đang chờ một sự kiện (ví dụ I/O)?", options: ["Ready", "Running", "Waiting", "Terminated"], correct: 2 },
        { text: "Thành phần nào KHÔNG nằm trong Process Control Block (PCB)?", options: ["Program Counter", "Nội dung file thực thi (mã lệnh)", "CPU Registers", "Process state"], correct: 1 },
        { text: "Trong Unix, system call dùng để tạo một tiến trình mới (bản sao) là:", options: ["exec()", "fork()", "wait()", "exit()"], correct: 1 },
        { text: "Điều nào đúng về phân cấp tiến trình (process hierarchy) trong Unix?", options: ["Không có khái niệm cha-con", "Mọi tiến trình đều bình đẳng", "Parent tạo child, tạo thành cây", "Chỉ có một tiến trình duy nhất"], correct: 2 },
        { text: "Lợi ích nào KHÔNG phải của thread so với process?", options: ["Responsiveness (đáp ứng nhanh)", "Resource sharing (chia sẻ tài nguyên)", "Bảo vệ bộ nhớ tốt hơn", "Economy (tiết kiệm tài nguyên)"], correct: 2 },
        { text: "Trong mô hình user-level threads, kernel có biết về các thread không?", options: ["Có, kernel quản lý từng thread", "Không, kernel chỉ thấy một process duy nhất", "Chỉ biết nếu thread tạo bằng clone()", "Tùy thuộc vào hệ điều hành"], correct: 1 },
        { text: "Giải thuật Round Robin (RR) thuộc loại điều phối nào?", options: ["Non-preemptive", "Preemptive", "First-Come-First-Served", "Priority Scheduling thuần túy"], correct: 1 },
        { text: "Hiện tượng 'convoy effect' (tiến trình ngắn bị chặn bởi tiến trình dài) xảy ra trong giải thuật nào?", options: ["Round Robin", "SJF", "FCFS", "Priority"], correct: 2 },
        { text: "Giải thuật nào tối ưu cho turnaround time nếu biết trước thời gian thực thi của các tiến trình?", options: ["FCFS", "Round Robin", "SJF (Shortest Job First)", "Priority Scheduling"], correct: 2 },
        { text: "Starvation (đói tài nguyên) trong priority scheduling có thể giải quyết bằng cách:", options: ["Tăng time quantum", "Aging (tăng dần ưu tiên theo thời gian chờ)", "Dùng FCFS", "Tắt preemption"], correct: 1 },
        { text: "Race condition là gì?", options: ["Khi hai process cùng chạy song song an toàn", "Khi kết quả phụ thuộc vào thứ tự thực thi không kiểm soát được", "Khi CPU không đủ nhanh", "Khi bộ nhớ bị tràn"], correct: 1 },
        { text: "Điều kiện nào SAU ĐÂY KHÔNG thuộc bốn điều kiện của mutual exclusion?", options: ["Không hai process nào trong critical region đồng thời", "Process phải chạy càng nhanh càng tốt", "Process ngoài critical region không được chặn process khác", "Không process nào chờ vô hạn để vào critical region"], correct: 1 },
        { text: "Lệnh TSL (Test and Set Lock) là một cơ chế phần cứng giúp:", options: ["Giảm dung lượng bộ nhớ", "Thực hiện nguyên tử việc kiểm tra và khóa", "Tăng tốc đồng hồ CPU", "Thay thế hoàn toàn semaphore"], correct: 1 },
        { text: "Semaphore là một cơ chế đồng bộ hóa. Thao tác Down(S) (P) thường được định nghĩa:", options: ["S.value++; nếu S.value <= 0 thì sleep", "S.value--; nếu S.value < 0 thì sleep", "S.value = 0; sleep", "S.value = 1; wakeup"], correct: 1 },
        { text: "Trong giải pháp Peterson’s solution cho mutual exclusion với 2 process, cần sử dụng:", options: ["Một biến turn và mảng interest[]", "Chỉ một biến lock", "Hai semaphore", "Vùng nhớ phân tán"], correct: 0 },
        { text: "Monitor là cấu trúc đồng bộ hóa bậc cao, đặc điểm nào đúng?", options: ["Do kernel quản lý hoàn toàn", "Tự động đảm bảo mutual exclusion, dùng condition variable", "Không thể giải quyết bài toán Producer-Consumer", "Chỉ hoạt động trong hệ thống đơn CPU"], correct: 1 },
        { text: "Trong bài toán Bounded Buffer (Producer-Consumer), semaphore thường được dùng để:", options: ["Đồng bộ hóa truy cập buffer và đếm số phần tử", "Thay thế bộ nhớ chính", "Tăng tốc độ sản xuất", "Ngăn chặn mọi tương tranh"], correct: 0 },
        { text: "Hard real-time system yêu cầu:", options: ["Hoàn thành công việc trong thời gian đảm bảo tuyệt đối", "Ưu tiên thấp", "Không cần lập lịch", "Chỉ dùng Round Robin"], correct: 0 },
        { text: "Context switch (chuyển ngữ cảnh) là hành động:", options: ["Lưu trạng thái tiến trình cũ và nạp trạng thái tiến trình mới", "Tắt CPU", "Gọi hàm hệ thống", "Khởi tạo bảng phân trang"], correct: 0 },
        { text: "Một process có 3 threads. Điều nào sau đây được chia sẻ giữa các thread?", options: ["Program counter", "Stack", "Global variables", "Thanh ghi riêng"], correct: 2 },
        { text: "Trong kỹ thuật 'sleep and wakeup' để tránh busy waiting, cần:", options: ["Hỗ trợ từ hệ điều hành (các hệ gọi sleep, wakeup)", "CPU phải thực hiện vòng lặp vô hạn", "Không cần điều kiện", "Chỉ áp dụng được cho 1 process"], correct: 0 },
        { text: "Điều phối đa cấp (Multilevel queue) thường dùng để:", options: ["Phân loại tiến trình theo độ ưu tiên (interactive, batch)", "Chỉ có một hàng đợi duy nhất", "Loại bỏ hoàn toàn preemption", "Chạy mọi tiến trình với time quantum bằng nhau"], correct: 0 },
        { text: "Trong mô hình kernel-level threads, điều nào đúng?", options: ["Kernel không biết đến thread", "Chi phí chuyển ngữ cảnh giữa các thread thấp hơn user-level", "Mỗi thread là đơn vị điều phối độc lập do kernel quản lý", "Thread bị block sẽ làm block cả process cha"], correct: 2 },
        { text: "Race condition có thể được giải quyết bằng cách đảm bảo:", options: ["Loại trừ lẫn nhau (mutual exclusion)", "Tăng tốc độ CPU", "Giảm số lượng tiến trình", "Dùng bộ nhớ ảo"], correct: 0 }
    ];

    // Hàm render toàn bộ câu hỏi
    function renderQuestions() {
        const container = document.getElementById('questions-container');
        container.innerHTML = '';
        questions.forEach((q, idx) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = `q-${idx}`;

            const qNumber = idx + 1;
            const qText = document.createElement('div');
            qText.className = 'question-text';
            qText.innerHTML = `${qNumber}. ${q.text}`;
            card.appendChild(qText);

            const optionsDiv = document.createElement('div');
            optionsDiv.className = 'options';

            q.options.forEach((opt, optIdx) => {
                const optId = `q${idx}_opt${optIdx}`;
                const optionDiv = document.createElement('div');
                optionDiv.className = 'option';

                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.name = `question${idx}`;
                radio.value = optIdx;
                radio.id = optId;

                const label = document.createElement('label');
                label.htmlFor = optId;
                label.textContent = `${String.fromCharCode(65+optIdx)}. ${opt}`; // A., B., C., D.

                optionDiv.appendChild(radio);
                optionDiv.appendChild(label);
                optionsDiv.appendChild(optionDiv);
            });
            card.appendChild(optionsDiv);
            container.appendChild(card);
        });
    }

    // Lấy đáp án người dùng
    function getUserAnswers() {
        const answers = [];
        for (let i = 0; i < questions.length; i++) {
            const radios = document.querySelectorAll(`input[name="question${i}"]`);
            let selected = null;
            for (let r of radios) {
                if (r.checked) {
                    selected = parseInt(r.value);
                    break;
                }
            }
            answers.push(selected);
        }
        return answers;
    }

    // Hiển thị kết quả và đáp án
    function showResults() {
        const userAnswers = getUserAnswers();
        let correctCount = 0;
        const reviewItems = [];

        for (let i = 0; i < questions.length; i++) {
            const q = questions[i];
            const userChoice = userAnswers[i];
            const isCorrect = (userChoice !== null && userChoice === q.correct);
            if (isCorrect) correctCount++;

            let userLetter = userChoice !== null ? String.fromCharCode(65+userChoice) : "❌ Chưa chọn";
            let correctLetter = String.fromCharCode(65+q.correct);
            let correctText = q.options[q.correct];
            let statusText = isCorrect ? "✅ Đúng" : "❌ Sai";

            reviewItems.push(`
                <div class="review-item">
                    <strong>Câu ${i+1}: ${q.text}</strong><br/>
                    <span class="user-choice">📌 Bạn chọn: ${userLetter} ${userChoice !== null ? q.options[userChoice] : '(chưa chọn)'}</span><br/>
                    <span class="correct-ans">✔ Đáp án đúng: ${correctLetter}. ${correctText}</span><br/>
                    <span>${statusText}</span>
                </div>
            `);
        }

        const scorePercent = (correctCount / questions.length * 100).toFixed(1);
        const resultDiv = document.getElementById('resultArea');
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = `
            <div class="score">🎯 Điểm số: ${correctCount} / ${questions.length} (${scorePercent}%)</div>
            <div class="answer-review">
                <h3>📖 Chi tiết đáp án:</h3>
                ${reviewItems.join('')}
            </div>
            <button id="resetQuizBtn" style="margin-top:16px; background:#2c7da0; border:none; color:white; padding:8px 24px; border-radius:40px; cursor:pointer;">🔄 Làm lại</button>
        `;
        // Làm lại toàn bộ (reset radio)
        const resetBtn = document.getElementById('resetQuizBtn');
        if (resetBtn) {
            resetBtn.addEventListener('click', () => {
                // clear all radio selections
                const allRadios = document.querySelectorAll('input[type="radio"]');
                allRadios.forEach(radio => radio.checked = false);
                resultDiv.style.display = 'none';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }
    }

    // Xử lý nộp bài
    function onSubmit() {
        showResults();
    }

    // Khởi tạo trang
    renderQuestions();
    document.getElementById('submitBtn').addEventListener('click', onSubmit);
</script>
</body>
</html>
