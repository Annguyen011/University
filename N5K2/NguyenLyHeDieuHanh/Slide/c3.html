<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Trắc nghiệm Chương 3: Quản lý bộ nhớ (Memory Management)</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #eef2f5;
            margin: 0;
            padding: 20px;
            color: #1a2c3a;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 28px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
            overflow: hidden;
            padding: 20px 24px 32px;
        }
        h1 {
            font-size: 1.9rem;
            margin-top: 0;
            margin-bottom: 0.25rem;
            color: #0a4b6e;
            border-left: 6px solid #0a4b6e;
            padding-left: 20px;
        }
        .sub {
            color: #4b6f86;
            margin-bottom: 28px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 12px;
            padding-left: 26px;
        }
        .question-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 18px 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid #e4edf2;
            transition: all 0.1s ease;
        }
        .question-text {
            font-weight: 600;
            font-size: 1.05rem;
            margin-bottom: 14px;
            color: #0b2b3b;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-left: 8px;
        }
        .option {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 40px;
            background: #f9fafc;
            transition: background 0.2s;
            border: 1px solid #e2edf2;
        }
        .option:hover {
            background: #eef3fa;
        }
        input[type="radio"] {
            width: 18px;
            height: 18px;
            accent-color: #2c7da0;
            margin: 0;
            cursor: pointer;
        }
        .option label {
            flex: 1;
            cursor: pointer;
            font-weight: normal;
            color: #1e4a6e;
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .submit-btn {
            background: #2c7da0;
            border: none;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 14px 28px;
            border-radius: 48px;
            cursor: pointer;
            margin: 28px 0 20px;
            width: 100%;
            transition: 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .submit-btn:hover {
            background: #1f5e7a;
            transform: scale(0.98);
        }
        .result-area {
            background: #e9f3f7;
            border-radius: 28px;
            padding: 18px 24px;
            margin-top: 15px;
            display: none;
            border-left: 8px solid #2c7da0;
        }
        .score {
            font-size: 1.6rem;
            font-weight: bold;
            color: #155f7c;
        }
        .answer-review {
            margin-top: 20px;
            max-height: 450px;
            overflow-y: auto;
            background: #ffffffd9;
            border-radius: 20px;
            padding: 8px 12px;
        }
        .review-item {
            border-bottom: 1px solid #dce7ef;
            padding: 12px 8px;
        }
        .correct-ans {
            color: #1f8a4c;
            font-weight: 500;
        }
        .user-choice {
            color: #b45353;
        }
        footer {
            text-align: center;
            margin-top: 25px;
            font-size: 0.75rem;
            color: #6c8d9e;
        }
        @media (max-width: 650px) {
            .container {
                padding: 16px;
            }
            .question-card {
                padding: 14px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🧠 Chương 3: Quản lý bộ nhớ</h1>
    <div class="sub">✅ 25 câu trắc nghiệm – Chọn đáp án, sau đó nhấn "Nộp bài" để xem kết quả và đáp án</div>

    <div id="questions-container"></div>

    <button class="submit-btn" id="submitBtn">📬 NỘP BÀI & XEM ĐÁP ÁN</button>
    <div id="resultArea" class="result-area"></div>
    <footer>Dựa trên nội dung Chương 3 – Memory Management (Paging, Segmentation, Virtual Memory)</footer>
</div>

<script>
    // ---------- 25 CÂU HỎI TRẮC NGHIỆM CHƯƠNG 3 ----------
    const questions = [
        { text: "Địa chỉ logic (logical address) là gì?", options: ["Địa chỉ thực tế trong RAM", "Địa chỉ do CPU tạo ra, còn gọi là virtual address", "Địa chỉ trên đĩa cứng", "Địa chỉ của thanh ghi"], correct: 1 },
        { text: "Hai thanh ghi dùng để bảo vệ vùng nhớ của một process là:", options: ["Base register và Limit register", "Program Counter và Stack Pointer", "Page Table Base Register và Page Table Length Register", "TLB và MMU"], correct: 0 },
        { text: "External fragmentation xảy ra khi:", options: ["Tổng bộ nhớ đủ nhưng không liên tục", "Cấp phát nhiều hơn yêu cầu", "Trang bị lỗi", "Bộ nhớ cache đầy"], correct: 0 },
        { text: "Internal fragmentation xảy ra khi:", options: ["Bộ nhớ bị chia cắt thành nhiều mảnh nhỏ", "Vùng nhớ được cấp phát lớn hơn yêu cầu, phần thừa nằm trong phân vùng", "Không đủ bộ nhớ để nạp trang", "Lỗi phân đoạn"], correct: 1 },
        { text: "Trong kỹ thuật paging, một page frame là:", options: ["Một khối bộ nhớ logic có kích thước cố định", "Một khối bộ nhớ vật lý có kích thước bằng kích thước trang", "Một mục trong bảng trang", "Một thanh ghi trong CPU"], correct: 1 },
        { text: "Page table chứa thông tin chính nào?", options: ["Ánh xạ từ địa chỉ vật lý sang địa chỉ logic", "Ánh xạ từ page number → frame number", "Lịch sử truy cập trang", "Kích thước của bộ nhớ ảo"], correct: 1 },
        { text: "TLB (Translation Lookaside Buffer) có tác dụng chính:", options: ["Tăng dung lượng bộ nhớ chính", "Giảm số lần truy cập bộ nhớ khi tra page table", "Thay thế hoàn toàn page table", "Lưu trữ toàn bộ page table"], correct: 1 },
        { text: "Page fault xảy ra khi:", options: ["Truy cập trang chưa được cấp phát", "Truy cập trang không có trong RAM", "Bộ nhớ bị tràn", "Lỗi bảo vệ bộ nhớ"], correct: 1 },
        { text: "Thuật toán page replacement nào được dùng làm chuẩn (benchmark) nhưng không thể cài đặt thực tế?", options: ["FIFO", "LRU", "Optimal", "Clock"], correct: 2 },
        { text: "Kỹ thuật segmentation khác paging ở điểm nào?", options: ["Không cần MMU", "Chia chương trình thành các đoạn có ý nghĩa logic, kích thước thay đổi", "Chỉ dùng cho hệ thống nhúng", "Không hỗ trợ bộ nhớ ảo"], correct: 1 },
        { text: "Compaction (nén bộ nhớ) được dùng để giải quyết vấn đề gì?", options: ["Internal fragmentation", "External fragmentation", "Page fault", "Thrashing"], correct: 1 },
        { text: "Trong ví dụ Pentium, linear address 32-bit được chia thành các trường:", options: ["10 bit directory, 10 bit table, 12 bit offset", "12 bit directory, 10 bit table, 10 bit offset", "8 bit directory, 8 bit table, 16 bit offset", "10 bit directory, 12 bit table, 10 bit offset"], correct: 0 },
        { text: "Bit 'dirty' (modified) trong page table entry dùng để:", options: ["Xác định trang có được phép đọc không", "Xác định trang đã bị ghi (thay đổi) chưa", "Xác định trang có trong cache không", "Xác định trang có được chia sẻ không"], correct: 1 },
        { text: "Thành phần nào chịu trách nhiệm chuyển đổi địa chỉ logic thành địa chỉ vật lý?", options: ["CPU", "ALU", "MMU (Memory Management Unit)", "TLB"], correct: 2 },
        { text: "Swapping là kỹ thuật:", options: ["Hoán đổi toàn bộ process giữa RAM và đĩa", "Chỉ hoán đổi các trang", "Chia bộ nhớ thành các phân vùng cố định", "Tăng kích thước bộ nhớ ảo"], correct: 0 },
        { text: "Trong paging, nếu kích thước trang càng nhỏ thì:", options: ["Ít phân mảnh nội hơn nhưng bảng trang lớn hơn", "Phân mảnh ngoại tăng", "Số lượng page fault giảm", "Hiệu suất luôn tốt hơn"], correct: 0 },
        { text: "Thuật toán LRU (Least Recently Used) trong page replacement có đặc điểm:", options: ["Dễ cài đặt chính xác", "Chọn trang ít được dùng nhất trong một khoảng thời gian", "Chọn trang vào sớm nhất", "Là trường hợp đặc biệt của FIFO"], correct: 1 },
        { text: "Trong segmentation, mỗi địa chỉ logic gồm:", options: ["Số frame và offset", "Số segment và offset", "Số page và offset", "Số khung và offset"], correct: 1 },
        { text: "Khi nào cần sử dụng page replacement?", options: ["Khi có page fault và không còn khung trang trống", "Khi TLB miss", "Khi process kết thúc", "Khi CPU rảnh"], correct: 0 },
        { text: "Tham số nào ảnh hưởng đến kích thước tối ưu của trang (page size)?", options: ["Kích thước trung bình của process và kích thước bảng trang", "Tốc độ CPU", "Dung lượng ổ đĩa", "Số lượng process"], correct: 0 },
        { text: "Paging daemon (background process) có nhiệm vụ:", options: ["Cấp phát bộ nhớ cho process mới", "Định kỳ đẩy các trang dirty ra đĩa để dự phòng", "Phát hiện deadlock", "Quản lý TLB"], correct: 1 },
        { text: "Trong kỹ thuật phân trang hai cấp (two-level paging), mỗi địa chỉ logic được chia thành:", options: ["Page number, Page offset", "Directory, Table, Offset", "Segment, Offset", "Frame, Line"], correct: 1 },
        { text: "Điều nào sau đây đúng về shared pages?", options: ["Mỗi process có bản sao riêng của trang dùng chung", "Nhiều process có thể ánh xạ cùng một frame vật lý vào page table của chúng", "Chỉ dùng cho code của kernel", "Không được phép trong hệ thống hiện đại"], correct: 1 },
        { text: "Kỹ thuật 'demand paging' có nghĩa là:", options: ["Nạp toàn bộ process vào RAM trước khi chạy", "Chỉ nạp trang khi process yêu cầu (khi xảy ra page fault)", "Luôn giữ tất cả trang trong RAM", "Chỉ dùng cho hệ thống batch"], correct: 1 },
        { text: "Thứ tự nào đúng khi xử lý page fault?", options: ["Trap vào kernel → tìm khung trống → đọc trang từ đĩa → cập nhật page table → restart lệnh", "Đọc trang từ đĩa → trap → cập nhật page table → restart", "Cập nhật page table → trap → đọc trang", "Restart lệnh → trap → tìm khung trống"], correct: 0 }
    ];

    // Render tất cả câu hỏi
    function renderQuestions() {
        const container = document.getElementById('questions-container');
        container.innerHTML = '';
        questions.forEach((q, idx) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = `q-${idx}`;

            const qNumber = idx + 1;
            const qText = document.createElement('div');
            qText.className = 'question-text';
            qText.innerHTML = `${qNumber}. ${q.text}`;
            card.appendChild(qText);

            const optionsDiv = document.createElement('div');
            optionsDiv.className = 'options';

            q.options.forEach((opt, optIdx) => {
                const optId = `q${idx}_opt${optIdx}`;
                const optionDiv = document.createElement('div');
                optionDiv.className = 'option';

                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.name = `question${idx}`;
                radio.value = optIdx;
                radio.id = optId;

                const label = document.createElement('label');
                label.htmlFor = optId;
                label.textContent = `${String.fromCharCode(65+optIdx)}. ${opt}`; // A., B., C., D.

                optionDiv.appendChild(radio);
                optionDiv.appendChild(label);
                optionsDiv.appendChild(optionDiv);
            });
            card.appendChild(optionsDiv);
            container.appendChild(card);
        });
    }

    // Lấy đáp án người dùng
    function getUserAnswers() {
        const answers = [];
        for (let i = 0; i < questions.length; i++) {
            const radios = document.querySelectorAll(`input[name="question${i}"]`);
            let selected = null;
            for (let r of radios) {
                if (r.checked) {
                    selected = parseInt(r.value);
                    break;
                }
            }
            answers.push(selected);
        }
        return answers;
    }

    // Hiển thị kết quả và đáp án
    function showResults() {
        const userAnswers = getUserAnswers();
        let correctCount = 0;
        const reviewItems = [];

        for (let i = 0; i < questions.length; i++) {
            const q = questions[i];
            const userChoice = userAnswers[i];
            const isCorrect = (userChoice !== null && userChoice === q.correct);
            if (isCorrect) correctCount++;

            let userLetter = userChoice !== null ? String.fromCharCode(65+userChoice) : "❌ Chưa chọn";
            let correctLetter = String.fromCharCode(65+q.correct);
            let correctText = q.options[q.correct];
            let statusText = isCorrect ? "✅ Đúng" : "❌ Sai";

            reviewItems.push(`
                <div class="review-item">
                    <strong>Câu ${i+1}: ${q.text}</strong><br/>
                    <span class="user-choice">📌 Bạn chọn: ${userLetter} ${userChoice !== null ? q.options[userChoice] : '(chưa chọn)'}</span><br/>
                    <span class="correct-ans">✔ Đáp án đúng: ${correctLetter}. ${correctText}</span><br/>
                    <span>${statusText}</span>
                </div>
            `);
        }

        const scorePercent = (correctCount / questions.length * 100).toFixed(1);
        const resultDiv = document.getElementById('resultArea');
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = `
            <div class="score">🎯 Điểm số: ${correctCount} / ${questions.length} (${scorePercent}%)</div>
            <div class="answer-review">
                <h3>📖 Chi tiết đáp án:</h3>
                ${reviewItems.join('')}
            </div>
            <button id="resetQuizBtn" style="margin-top:16px; background:#2c7da0; border:none; color:white; padding:8px 24px; border-radius:40px; cursor:pointer;">🔄 Làm lại</button>
        `;
        // Reset toàn bộ
        const resetBtn = document.getElementById('resetQuizBtn');
        if (resetBtn) {
            resetBtn.addEventListener('click', () => {
                const allRadios = document.querySelectorAll('input[type="radio"]');
                allRadios.forEach(radio => radio.checked = false);
                resultDiv.style.display = 'none';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }
    }

    function onSubmit() {
        showResults();
    }

    renderQuestions();
    document.getElementById('submitBtn').addEventListener('click', onSubmit);
</script>
</body>
</html>
