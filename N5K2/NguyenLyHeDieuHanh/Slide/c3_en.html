<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Quiz Chapter 3: Memory Management</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: #eef2f5; margin: 0; padding: 20px; color: #1a2c3a; }
        .container { max-width: 1000px; margin: 0 auto; background: white; border-radius: 28px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); padding: 20px 24px 32px; }
        h1 { font-size: 1.9rem; margin-top: 0; margin-bottom: 0.25rem; color: #0a4b6e; border-left: 6px solid #0a4b6e; padding-left: 20px; }
        .sub { color: #4b6f86; margin-bottom: 28px; border-bottom: 1px solid #e2e8f0; padding-bottom: 12px; padding-left: 26px; }
        .question-card { background: #ffffff; border-radius: 20px; padding: 18px 20px; margin-bottom: 20px; border: 1px solid #e4edf2; }
        .question-text { font-weight: 600; font-size: 1.05rem; margin-bottom: 14px; color: #0b2b3b; }
        .options { display: flex; flex-direction: column; gap: 10px; padding-left: 8px; }
        .option { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 40px; background: #f9fafc; border: 1px solid #e2edf2; }
        .option:hover { background: #eef3fa; }
        input[type="radio"] { width: 18px; height: 18px; accent-color: #2c7da0; cursor: pointer; }
        .option label { flex: 1; cursor: pointer; color: #1e4a6e; }
        .submit-btn { background: #2c7da0; border: none; color: white; font-size: 1.2rem; font-weight: bold; padding: 14px 28px; border-radius: 48px; cursor: pointer; width: 100%; margin: 28px 0 20px; }
        .submit-btn:hover { background: #1f5e7a; }
        .result-area { background: #e9f3f7; border-radius: 28px; padding: 18px 24px; display: none; border-left: 8px solid #2c7da0; }
        .score { font-size: 1.6rem; font-weight: bold; color: #155f7c; }
        .answer-review { margin-top: 20px; max-height: 450px; overflow-y: auto; background: #ffffffd9; border-radius: 20px; padding: 8px 12px; }
        .review-item { border-bottom: 1px solid #dce7ef; padding: 12px 8px; }
        .correct-ans { color: #1f8a4c; font-weight: 500; }
        .user-choice { color: #b45353; }
        footer { text-align: center; margin-top: 25px; font-size: 0.75rem; color: #6c8d9e; }
    </style>
</head>
<body>
<div class="container">
    <h1>🧠 Chapter 3: Memory Management</h1>
    <div class="sub">✅ 25 multiple-choice questions – Choose your answer, then click "Submit"</div>

    <div id="questions-container"></div>
    <button class="submit-btn" id="submitBtn">📬 SUBMIT & VIEW ANSWERS</button>
    <div id="resultArea" class="result-area"></div>
    <footer>Based on Chapter 3 – Memory Management (Paging, Segmentation, Virtual Memory)</footer>
</div>

<script>
    const questions = [
        { text: "What is a logical address?", options: ["The actual address in RAM", "An address generated by the CPU, also known as a virtual address", "An address on the hard drive", "A register address"], correct: 1 },
        { text: "Two registers used to protect a process's memory space are:", options: ["Base register and Limit register", "Program Counter and Stack Pointer", "Page Table Base Register and Page Table Length Register", "TLB and MMU"], correct: 0 },
        { text: "External fragmentation occurs when:", options: ["Total memory is sufficient but not contiguous", "Memory allocated is larger than requested", "A page faults", "The cache is full"], correct: 0 },
        { text: "Internal fragmentation occurs when:", options: ["Memory is divided into many small fragments", "Allocated memory is larger than requested, leaving unused space inside the partition", "Not enough memory to load a page", "Segmentation fault"], correct: 1 },
        { text: "In paging, what is a page frame?", options: ["A logical memory block of fixed size", "A physical memory block with the same size as a page", "An entry in the page table", "A register in the CPU"], correct: 1 },
        { text: "What primary information does a page table hold?", options: ["Mappings from physical to logical addresses", "Mappings from page number to frame number", "Page access history", "Size of virtual memory"], correct: 1 },
        { text: "The main function of a TLB (Translation Lookaside Buffer) is:", options: ["Increasing main memory capacity", "Reducing memory access time when looking up the page table", "Completely replacing the page table", "Storing the entire page table"], correct: 1 },
        { text: "A page fault occurs when:", options: ["Accessing an unallocated page", "Accessing a page not currently in RAM", "Memory overflows", "Memory protection error"], correct: 1 },
        { text: "Which page replacement algorithm is used as a benchmark but cannot be implemented in reality?", options: ["FIFO", "LRU", "Optimal", "Clock"], correct: 2 },
        { text: "How does segmentation differ from paging?", options: ["It doesn't require an MMU", "It divides programs into logical segments of variable sizes", "It's only used in embedded systems", "It doesn't support virtual memory"], correct: 1 },
        { text: "Compaction is used to solve which problem?", options: ["Internal fragmentation", "External fragmentation", "Page fault", "Thrashing"], correct: 1 },
        { text: "In the Pentium example, the 32-bit linear address is divided into:", options: ["10 bit directory, 10 bit table, 12 bit offset", "12 bit directory, 10 bit table, 10 bit offset", "8 bit directory, 8 bit table, 16 bit offset", "10 bit directory, 12 bit table, 10 bit offset"], correct: 0 },
        { text: "The 'dirty' (modified) bit in a page table entry is used to:", options: ["Determine if the page is readable", "Determine if the page has been written to (modified)", "Determine if the page is in cache", "Determine if the page is shared"], correct: 1 },
        { text: "Which component is responsible for translating logical addresses to physical addresses?", options: ["CPU", "ALU", "MMU (Memory Management Unit)", "TLB"], correct: 2 },
        { text: "What is swapping?", options: ["Exchanging the entire process between RAM and disk", "Only exchanging pages", "Dividing memory into fixed partitions", "Increasing virtual memory size"], correct: 0 },
        { text: "In paging, if the page size is smaller, then:", options: ["There is less internal fragmentation but a larger page table", "External fragmentation increases", "The number of page faults decreases", "Performance is always better"], correct: 0 },
        { text: "The LRU (Least Recently Used) algorithm replaces the page that:", options: ["Is easy to perfectly implement", "Has not been used for the longest period of time", "Was loaded first", "Is a special case of FIFO"], correct: 1 },
        { text: "In segmentation, each logical address consists of:", options: ["Frame number and offset", "Segment number and offset", "Page number and offset", "Block number and offset"], correct: 1 },
        { text: "When is page replacement required?", options: ["When a page fault occurs and there are no free page frames", "When a TLB miss occurs", "When a process finishes", "When the CPU is idle"], correct: 0 },
        { text: "What parameter influences the optimal page size?", options: ["Average process size and page table size", "CPU speed", "Disk capacity", "Number of processes"], correct: 0 },
        { text: "The task of the paging daemon is to:", options: ["Allocate memory for new processes", "Periodically write dirty pages to disk to reserve free frames", "Detect deadlocks", "Manage the TLB"], correct: 1 },
        { text: "In two-level paging, the logical address is divided into:", options: ["Page number, Page offset", "Directory, Table, Offset", "Segment, Offset", "Frame, Line"], correct: 1 },
        { text: "Which is true about shared pages?", options: ["Each process has its own copy", "Multiple processes can map the same physical frame into their page tables", "Only used for kernel code", "Not allowed in modern systems"], correct: 1 },
        { text: "What does 'demand paging' mean?", options: ["Loading the entire process into RAM before running", "Only loading a page when the process requests it (on page fault)", "Always keeping all pages in RAM", "Only used for batch systems"], correct: 1 },
        { text: "What is the correct sequence when handling a page fault?", options: ["Trap to kernel → find free frame → read page from disk → update page table → restart instruction", "Read page → trap → update table → restart", "Update table → trap → read page", "Restart instruction → trap → find frame"], correct: 0 }
    ];

    questions.forEach(q => {
        let opts = q.options.map((text, idx) => ({text, isCorrect: idx === q.correct}));
        for (let i = opts.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [opts[i], opts[j]] = [opts[j], opts[i]];
        }
        q.options = opts.map(o => o.text);
        q.correct = opts.findIndex(o => o.isCorrect);
    });

    let currentQuestions = [...questions];
    for (let i = currentQuestions.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [currentQuestions[i], currentQuestions[j]] = [currentQuestions[j], currentQuestions[i]];
    }

    function renderQuestions() {
        const container = document.getElementById('questions-container');
        container.innerHTML = '';
        currentQuestions.forEach((q, idx) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.innerHTML = `<div class="question-text">${idx + 1}. ${q.text}</div>`;
            
            const optionsDiv = document.createElement('div');
            optionsDiv.className = 'options';
            q.options.forEach((opt, optIdx) => {
                optionsDiv.innerHTML += `
                <div class="option">
                    <input type="radio" name="q${idx}" value="${optIdx}" id="q${idx}o${optIdx}">
                    <label for="q${idx}o${optIdx}">${String.fromCharCode(65+optIdx)}. ${opt}</label>
                </div>`;
            });
            card.appendChild(optionsDiv);
            container.appendChild(card);
        });
    }

    document.getElementById('submitBtn').addEventListener('click', () => {
        let correctCount = 0;
        const reviewItems = [];
        currentQuestions.forEach((q, i) => {
            const selected = document.querySelector(`input[name="q${i}"]:checked`);
            const choice = selected ? parseInt(selected.value) : null;
            if (choice === q.correct) correctCount++;
            
            reviewItems.push(`
                <div class="review-item">
                    <strong>Q${i+1}: ${q.text}</strong><br/>
                    <span class="user-choice">📌 Your choice: ${choice !== null ? String.fromCharCode(65+choice) + '. ' + q.options[choice] : 'Not selected'}</span><br/>
                    <span class="correct-ans">✔ Correct: ${String.fromCharCode(65+q.correct)}. ${q.options[q.correct]}</span><br/>
                    <span>${choice === q.correct ? '✅ Correct' : '❌ Incorrect'}</span>
                </div>`);
        });

        const resArea = document.getElementById('resultArea');
        resArea.style.display = 'block';
        resArea.innerHTML = `
            <div class="score">🎯 Score: ${correctCount} / ${currentQuestions.length}</div>
            <div class="answer-review">${reviewItems.join('')}</div>
            <button id="resetBtn" style="margin-top:16px; background:#2c7da0; border:none; color:white; padding:8px 24px; border-radius:40px; cursor:pointer;">🔄 Retry</button>`;
        
        document.getElementById('resetBtn').addEventListener('click', () => {
            document.querySelectorAll('input[type="radio"]').forEach(r => r.checked = false);
            resArea.style.display = 'none';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    });
    renderQuestions();
</script>
</body>
</html>
